<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="radix64 — 文本与 Base64 互转，UTF-8 安全，带实时字节/字符/填充读数与 64 字符表">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>radix64 · 文本 ↔ Base64</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --paper: #E7EBEF;
      --grid: #D8DEE5;
      --panel: #FCFDFE;
      --ink: #16202B;
      --ink-soft: #5C6B79;
      --line: #C4CDD6;
      --line-strong: #A7B2BD;
      --code: #1D3FCC;      /* 编码 / base64 状态 */
      --code-tint: #E8ECFF;
      --byte: #B4740F;      /* 原始字节 / 文本状态 */
      --byte-ink: #855510;
      --byte-tint: #F7EEDA;
      --byte-line: #E1C68C;
      --ok: #1F7A46;
      --bad: #B23636;
      --r: 5px;
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'DejaVu Sans Mono', monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 26px 26px;
      display: flex;
      justify-content: center;
      padding: 44px 20px;
    }

    /* 仪表盘外框 */
    .plate {
      width: 100%;
      max-width: 900px;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 18px 44px -28px rgba(22, 32, 43, .55);
      overflow: hidden;
    }

    /* 顶栏：字标 + 实时读数 */
    .head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    .mark { font-family: var(--mono); font-weight: 600; font-size: 23px; letter-spacing: -.6px; }
    .mark i { color: var(--code); font-style: normal; }
    .mark + .sub { margin-top: 3px; }
    .sub { font-size: 13px; color: var(--ink-soft); }

    .ledger { display: flex; gap: 22px; }
    .metric { text-align: right; min-width: 42px; }
    .metric b { display: block; font-family: var(--mono); font-weight: 500; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
    .metric span { font-size: 11px; color: var(--ink-soft); }
    .metric.-pad b { color: var(--byte-ink); }

    /* 控制条 */
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(var(--panel), #F6F8FA);
    }
    .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); }
    .seg button { border: 0; background: transparent; font-family: var(--sans); font-size: 13px; padding: 7px 13px; border-radius: 3px; color: var(--ink-soft); cursor: pointer; transition: background .15s, color .15s; }
    .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(22, 32, 43, .18); }
    .linkbtn { border: 0; background: transparent; color: var(--code); font-family: var(--sans); font-size: 13px; cursor: pointer; padding: 6px 4px; }
    .linkbtn:hover { text-decoration: underline; }
    /* 输入输出区 */
    .io { padding: 22px 24px 6px; }
    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
    .cap em { font-style: normal; font-size: 13px; color: var(--ink-soft); }
    .cap .len { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .box {
      width: 100%;
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      word-break: break-all;
    }
    .box:focus { border-color: var(--code); box-shadow: 0 0 0 3px var(--code-tint); }
    .box[readonly] { background: #F5F7FA; color: #33414F; }
    .box.-flash { animation: flash .5s ease; }
    @keyframes flash { from { background: var(--code-tint); } to { background: #fff; } }
    .hide { display: none !important; }

    /* 动作按钮 */
    .acts { display: flex; gap: 12px; padding: 6px 24px 22px; }
    .btn {
      flex: 1;
      font-family: var(--sans);
      font-size: 14.5px;
      font-weight: 600;
      padding: 13px 16px;
      border-radius: var(--r);
      border: 1px solid var(--line-strong);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      transition: transform .07s, filter .15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn.-code { background: var(--code); border-color: var(--code); color: #fff; }
    .btn.-code:hover { filter: brightness(1.08); }
    .btn.-byte { background: var(--byte-tint); border-color: var(--byte-line); color: var(--byte-ink); }
    .btn.-byte:hover { filter: brightness(1.02); }

    /* 64 字符表（本工具的标志元素） */
    .keys { padding: 16px 24px; border-top: 1px solid var(--line); background: #F6F8FA; }
    .keys .cap { margin-bottom: 10px; }
    .keys__grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .key {
      font-family: var(--mono);
      font-size: 12px;
      width: 21px; height: 22px;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      color: var(--ink-soft);
      transition: background .2s, color .2s, border-color .2s;
    }
    .key.-on { background: var(--code); border-color: var(--code); color: #fff; }
    .key.-pad { background: var(--byte-tint); border-color: var(--byte-line); color: var(--byte-ink); margin-left: 6px; }

    /* 状态行 */
    .status { font-family: var(--mono); font-size: 12.5px; padding: 12px 24px; border-top: 1px solid var(--line); color: var(--ink-soft); }
    .status.-ok { color: var(--ok); }
    .status.-bad { color: var(--bad); }
    .foot { font-size: 11.5px; color: var(--ink-soft); padding: 0 24px 18px; }

    :focus-visible { outline: 2px solid var(--code); outline-offset: 2px; }

    @media (max-width: 560px) {
      body { padding: 20px 12px; }
      .head { flex-direction: column; align-items: flex-start; gap: 14px; }
      .ledger { gap: 18px; }
      .metric { text-align: left; }
      .acts { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<main class="plate">
  <div class="head">
    <div>
      <div class="mark">radix<i>64</i></div>
      <div class="sub">文本与 Base64 互转，自动处理中文与 Unicode</div>
    </div>
    <div class="ledger" id="ledger">
      <div class="metric"><b id="mChars">0</b><span>字符</span></div>
      <div class="metric"><b id="mBytes">0</b><span>UTF-8 字节</span></div>
      <div class="metric -pad"><b id="mPad">0</b><span>填充 =</span></div>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="group" aria-label="输出位置">
      <button id="segInPlace" aria-pressed="true">就地替换</button>
      <button id="segNew" aria-pressed="false">输出到新框</button>
    </div>
    <div>
      <button class="linkbtn" id="btnSample">填示例</button>
      <button class="linkbtn" id="btnClear">清空</button>
    </div>
  </div>

  <div class="io">
    <div class="field">
      <div class="cap"><em id="capIn">内容</em><span class="len" id="lenIn"></span></div>
      <textarea class="box" id="input" rows="8" spellcheck="false"
        placeholder="输入文本，或粘贴一段 Base64"></textarea>
    </div>
    <div class="field hide" id="outField">
      <div class="cap"><em>结果</em><span class="len" id="lenOut"></span></div>
      <textarea class="box" id="output" rows="6" spellcheck="false" readonly
        placeholder="转换结果显示在这里，点一下即可复制"></textarea>
    </div>
  </div>

  <div class="acts">
    <button class="btn -code" id="btnEncode">编码为 Base64</button>
    <button class="btn -byte" id="btnDecode">解码为文本</button>
  </div>

  <div class="keys">
    <div class="cap"><em>Base64 用到的 64 个字符，转出结果里出现过的会点亮</em></div>
    <div class="keys__grid" id="keys"></div>
  </div>

  <div class="status" id="status">就绪。默认就地替换，也可切到新框保留原文。</div>
  <div class="foot">纯前端运行，内容不会离开你的浏览器。解码前会自动去掉空格与换行。</div>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const input = $('input'), output = $('output'), outField = $('outField');
  const status = $('status'), capIn = $('capIn');

  // 输出位置：inplace（就地替换） | separate（输出到新框）
  let target = 'inplace';

  // ---------- 状态提示 ----------
  function say(text, type) {
    status.textContent = text;
    status.classList.remove('-ok', '-bad');
    if (type) status.classList.add('-' + type);
  }

  // ---------- UTF-8 安全的编解码 ----------
  function encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function decode(b64) {
    const cleaned = edgeTrim(b64).replace(/\s/g, '');
    if (!cleaned) throw new Error('去掉多余字符后没有内容');
    const bin = atob(cleaned);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
  }
  // 去掉首尾不属于 Base64 的字符（引号、说明文字、标点、空白等），中间保持不动
  function edgeTrim(str) {
    return str.replace(/^[^A-Za-z0-9+/=_-]+/, '').replace(/[^A-Za-z0-9+/=_-]+$/, '');
  }

  // ---------- 实时读数 + 字符表点亮 ----------
  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const keyEls = {};
  (function buildKeys() {
    const grid = $('keys');
    for (const ch of ALPHABET) {
      const el = document.createElement('div');
      el.className = 'key'; el.textContent = ch;
      keyEls[ch] = el; grid.appendChild(el);
    }
    const pad = document.createElement('div');
    pad.className = 'key -pad'; pad.textContent = '='; pad.title = '填充字符';
    grid.appendChild(pad);
  })();

  function lightKeys(b64) {
    const present = new Set(b64.replace(/\s/g, ''));
    for (const ch in keyEls) keyEls[ch].classList.toggle('-on', present.has(ch));
  }

  function refresh() {
    const src = input.value;
    $('mChars').textContent = Array.from(src).length;
    $('mBytes').textContent = new TextEncoder().encode(src).length;
    const stripped = src.replace(/\s/g, '');
    const m = stripped.match(/=+$/);
    $('mPad').textContent = m ? m[0].length : 0;
    $('lenIn').textContent = src ? src.length + ' 字符' : '';
    if (target === 'separate') $('lenOut').textContent = output.value ? output.value.length + ' 字符' : '';
  }

  // ---------- 执行转换 ----------
  function run(kind) {
    const src = input.value;
    if (!src.trim()) { say('先输入点内容再转换', 'bad'); input.focus(); return; }
    let result;
    try {
      result = kind === 'encode' ? encode(src) : decode(src);
    } catch (e) {
      say(kind === 'encode' ? '编码失败：' + e.message
                            : '这段不是有效的 Base64，检查是否缺字符或多了别的符号', 'bad');
      return;
    }
    const dest = target === 'separate' ? output : input;
    dest.value = result;
    dest.classList.remove('-flash'); void dest.offsetWidth; dest.classList.add('-flash');
    if (kind === 'encode') {
      lightKeys(result);
      refresh();
      say('已编码为 Base64，' + result.length + ' 个字符', 'ok');
    } else {
      const removed = src.length - edgeTrim(src).length;
      lightKeys(edgeTrim(src));
      refresh();
      say('已解码为文本，' + Array.from(result).length + ' 个字符'
          + (removed > 0 ? '（已去掉首尾 ' + removed + ' 个非 Base64 字符）' : ''), 'ok');
    }
  }

  // ---------- 输出位置切换 ----------
  function setTarget(next) {
    target = next;
    const sep = next === 'separate';
    $('segInPlace').setAttribute('aria-pressed', String(!sep));
    $('segNew').setAttribute('aria-pressed', String(sep));
    outField.classList.toggle('hide', !sep);
    capIn.textContent = sep ? '输入' : '内容';
    if (!sep) output.value = '';
    refresh();
  }

  // ---------- 事件 ----------
  $('btnEncode').addEventListener('click', () => run('encode'));
  $('btnDecode').addEventListener('click', () => run('decode'));
  $('segInPlace').addEventListener('click', () => setTarget('inplace'));
  $('segNew').addEventListener('click', () => setTarget('separate'));
  input.addEventListener('input', () => { refresh(); if (input.value === '') lightKeys(''); });

  $('btnClear').addEventListener('click', () => {
    input.value = ''; output.value = ''; lightKeys(''); refresh();
    say('已清空'); input.focus();
  });
  $('btnSample').addEventListener('click', () => {
    input.value = 'Hello Base64 🚀 世界你好'; refresh(); lightKeys('');
    say('已填入示例，点上面的按钮试试');
  });

  // 点结果框即复制
  output.addEventListener('click', () => {
    if (!output.value) return;
    output.select();
    const done = () => say('结果已复制到剪贴板', 'ok');
    if (navigator.clipboard) navigator.clipboard.writeText(output.value).then(done).catch(done);
    else { document.execCommand('copy'); done(); }
  });

  // ---------- 初始 ----------
  input.value = 'Hello Base64 🚀 世界你好';
  refresh();
})();
</script>
</body>
</html>
