<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="radix64 — 文件与 Base64 互转：文件转 Base64、Base64 转文件下载，内置照片/音频/视频等头部，按文件签名自动识别类型">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>radix64 · 文件 ↔ Base64</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --paper: #E7EBEF;
      --grid: #D8DEE5;
      --panel: #FCFDFE;
      --ink: #16202B;
      --ink-soft: #5C6B79;
      --line: #C4CDD6;
      --line-strong: #A7B2BD;
      --code: #1D3FCC;
      --code-tint: #E8ECFF;
      --byte: #B4740F;
      --byte-ink: #855510;
      --byte-tint: #F7EEDA;
      --byte-line: #E1C68C;
      --ok: #1F7A46;
      --bad: #B23636;
      --r: 5px;
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'DejaVu Sans Mono', monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: var(--sans); font-size: 15px; line-height: 1.55;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 26px 26px;
      display: flex; justify-content: center; padding: 44px 20px;
    }

    .plate {
      width: 100%; max-width: 900px; background: var(--panel);
      border: 1px solid var(--line-strong); border-radius: var(--r);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 18px 44px -28px rgba(22, 32, 43, .55);
      overflow: hidden;
    }
    .head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 20px; padding: 22px 24px 18px; border-bottom: 1px solid var(--line);
    }
    .mark { font-family: var(--mono); font-weight: 600; font-size: 23px; letter-spacing: -.6px; }
    .mark i { color: var(--code); font-style: normal; }
    .sub { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
    .ledger { display: flex; gap: 22px; }
    .metric { text-align: right; min-width: 42px; }
    .metric b { display: block; font-family: var(--mono); font-weight: 500; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
    .metric span { font-size: 11px; color: var(--ink-soft); }
    .metric.-code b { color: var(--code); }

    .bar {
      display: flex; align-items: center; gap: 12px; padding: 14px 24px;
      border-bottom: 1px solid var(--line); background: linear-gradient(var(--panel), #F6F8FA);
    }
    .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--r); }
    .seg button { border: 0; background: transparent; font-family: var(--sans); font-size: 13px; padding: 7px 13px; border-radius: 3px; color: var(--ink-soft); cursor: pointer; transition: background .15s, color .15s; }
    .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(22, 32, 43, .18); }

    .panel { padding: 22px 24px 8px; display: none; }
    .panel.on { display: block; }

    .field { margin-bottom: 18px; }
    .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
    .cap em { font-style: normal; font-size: 13px; color: var(--ink-soft); }
    .mini { border: 1px solid var(--line-strong); background: var(--panel); color: var(--code); font-family: var(--sans); font-size: 12px; padding: 4px 12px; border-radius: 3px; cursor: pointer; }
    .mini:hover { background: var(--code-tint); }

    .box {
      width: 100%; font-family: var(--mono); font-size: 14px; line-height: 1.6;
      color: var(--ink); background: #fff; border: 1px solid var(--line-strong);
      border-radius: var(--r); padding: 13px 15px; resize: vertical; outline: none;
      transition: border-color .15s, box-shadow .15s; word-break: break-all;
    }
    .box:focus { border-color: var(--code); box-shadow: 0 0 0 3px var(--code-tint); }
    .box[readonly] { background: #F5F7FA; color: #33414F; }
    /* 文件投入口 */
    .intake {
      display: block;
      border: 1.5px dashed var(--line-strong); border-radius: var(--r);
      padding: 34px 20px; text-align: center; cursor: pointer; background: #F6F8FA;
      transition: border-color .15s, background .15s;
    }
    .intake:hover, .intake.-drag { border-color: var(--code); background: var(--code-tint); }
    .intake .big { font-family: var(--mono); font-size: 15px; color: var(--ink); }
    .intake .tip { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
    .intake input { display: none; }

    /* 文件签名读数（本工具的标志元素） */
    .sig { display: none; margin: 16px 0; border: 1px solid var(--line-strong); border-left: 3px solid var(--code); border-radius: var(--r); background: #F6F8FA; overflow: hidden; }
    .sig.show { display: block; }
    .sig__top { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
    .sig__name { flex: 1 1 auto; min-width: 0; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sig__mime { flex: 0 0 auto; font-family: var(--mono); font-size: 12.5px; color: var(--code); background: var(--code-tint); padding: 4px 10px; border-radius: 3px; white-space: nowrap; }
    .sig__mime.-guess { color: var(--byte-ink); background: var(--byte-tint); }
    .sig__hex { font-family: var(--mono); font-size: 12.5px; letter-spacing: 1.5px; color: var(--ink-soft); padding: 0 14px 12px; word-break: break-all; }
    .sig__hex b { color: var(--code); font-weight: 600; }

    /* 选择器 / 输入 */
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > .col { flex: 1; min-width: 210px; }
    select, input[type="text"] {
      width: 100%; padding: 11px 13px; border: 1px solid var(--line-strong);
      border-radius: var(--r); font-size: 14px; font-family: var(--sans);
      outline: none; background: #fff; color: var(--ink); transition: border-color .15s, box-shadow .15s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--code); box-shadow: 0 0 0 3px var(--code-tint); }

    .acts { display: flex; gap: 12px; padding: 8px 0 0; }
    .btn {
      flex: 1; font-family: var(--sans); font-size: 14.5px; font-weight: 600;
      padding: 13px 16px; border-radius: var(--r); border: 1px solid var(--line-strong);
      background: var(--panel); color: var(--ink); cursor: pointer; transition: transform .07s, filter .15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn.-code { background: var(--code); border-color: var(--code); color: #fff; }
    .btn.-code:hover { filter: brightness(1.08); }
    .btn.-ghost { background: var(--panel); }
    .btn.-ghost:hover { background: #F0F3F6; }

    .preview { display: none; margin-top: 18px; text-align: center; }
    .preview.show { display: block; }
    .preview img, .preview video { max-width: 100%; max-height: 320px; border: 1px solid var(--line); border-radius: var(--r); }
    .preview audio { width: 100%; }

    .status { font-family: var(--mono); font-size: 12.5px; padding: 12px 24px; border-top: 1px solid var(--line); color: var(--ink-soft); }
    .status.-ok { color: var(--ok); }
    .status.-bad { color: var(--bad); }
    .foot { font-size: 11.5px; color: var(--ink-soft); padding: 0 24px 18px; }
    .hide { display: none !important; }

    :focus-visible { outline: 2px solid var(--code); outline-offset: 2px; }

    @media (max-width: 560px) {
      body { padding: 20px 12px; }
      .head { flex-direction: column; align-items: flex-start; gap: 14px; }
      .metric { text-align: left; }
      .acts { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<main class="plate">
  <div class="head">
    <div>
      <div class="mark">radix<i>64</i></div>
      <div class="sub">文件与 Base64 互转，按文件签名认出类型</div>
    </div>
    <div class="ledger">
      <div class="metric"><b id="mIn">0</b><span id="mInK">输入</span></div>
      <div class="metric -code"><b id="mOut">0</b><span id="mOutK">Base64</span></div>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="group" aria-label="转换方向">
      <button id="segF2B" aria-pressed="true">文件转 Base64</button>
      <button id="segB2F" aria-pressed="false">Base64 转文件</button>
    </div>
  </div>

  <!-- 文件 → Base64 -->
  <div class="panel on" id="panelF2B">
    <label class="intake" id="intake">
      <div class="big">拖入文件，或点这里选择</div>
      <div class="tip">图片、音频、视频、PDF、压缩包都行，全部在本地处理</div>
      <input type="file" id="fileInput">
    </label>

    <div class="sig" id="sigA">
      <div class="sig__top">
        <span class="sig__name" id="sigAName"></span>
        <span class="sig__mime" id="sigAMime"></span>
      </div>
      <div class="sig__hex" id="sigAHex"></div>
    </div>

    <div class="field">
      <div class="cap"><em>纯 Base64（不含头部）</em><button class="mini" data-copy="outRaw">复制</button></div>
      <textarea class="box" id="outRaw" rows="5" readonly spellcheck="false" placeholder="选择文件后显示在这里"></textarea>
    </div>
    <div class="field">
      <div class="cap"><em>完整 Data URI（可直接用作图片地址）</em><button class="mini" data-copy="outUri">复制</button></div>
      <textarea class="box" id="outUri" rows="4" readonly spellcheck="false" placeholder="形如 data:image/png;base64,iVBORw0K…"></textarea>
    </div>
  </div>

  <!-- Base64 → 文件 -->
  <div class="panel" id="panelB2F">
    <div class="field">
      <div class="cap"><em>粘贴 Base64（带 data: 头部或纯 Base64 都行）</em><button class="mini" id="clearInput">清空</button></div>
      <textarea class="box" id="b64Input" rows="6" spellcheck="false"
        placeholder="在这里粘贴 Base64，例如 data:image/png;base64,iVBORw0K… 或直接 iVBORw0KGgo…"></textarea>
    </div>

    <div class="sig" id="sigB">
      <div class="sig__top">
        <span class="sig__name" id="sigBName">文件签名</span>
        <span class="sig__mime" id="sigBMime"></span>
      </div>
      <div class="sig__hex" id="sigBHex"></div>
    </div>

    <div class="row">
      <div class="col field">
        <div class="cap"><em>文件头部（类型）</em></div>
        <select id="headerSelect"></select>
      </div>
      <div class="col field">
        <div class="cap"><em>保存文件名</em></div>
        <input type="text" id="fileName" placeholder="下载文件.png">
      </div>
    </div>
    <div class="field hide" id="customMimeWrap">
      <div class="cap"><em>自定义 MIME 类型</em></div>
      <input type="text" id="customMime" placeholder="例如 image/avif、font/woff2">
    </div>

    <div class="acts">
      <button class="btn -ghost" id="detectBtn">识别类型</button>
      <button class="btn -code" id="downloadBtn">下载为文件</button>
    </div>

    <div class="preview" id="preview"></div>
  </div>

  <div class="status" id="status">就绪。选文件生成 Base64，或粘贴 Base64 还原成文件。</div>
  <div class="foot">纯前端运行，文件不会上传。解码前会自动去掉空格与换行。</div>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const status = $('status');

  function say(text, type) {
    status.textContent = text;
    status.classList.remove('-ok', '-bad');
    if (type) status.classList.add('-' + type);
  }
  function size(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ---------- 内置头部预设 ----------
  const PRESETS = [
    { g: '照片', n: 'PNG 图片', mime: 'image/png', ext: 'png' },
    { g: '照片', n: 'JPEG 图片', mime: 'image/jpeg', ext: 'jpg' },
    { g: '照片', n: 'GIF 图片', mime: 'image/gif', ext: 'gif' },
    { g: '照片', n: 'WebP 图片', mime: 'image/webp', ext: 'webp' },
    { g: '照片', n: 'BMP 图片', mime: 'image/bmp', ext: 'bmp' },
    { g: '照片', n: 'SVG 图片', mime: 'image/svg+xml', ext: 'svg' },
    { g: '照片', n: 'ICO 图标', mime: 'image/x-icon', ext: 'ico' },
    { g: '音频', n: 'MP3 音频', mime: 'audio/mpeg', ext: 'mp3' },
    { g: '音频', n: 'WAV 音频', mime: 'audio/wav', ext: 'wav' },
    { g: '音频', n: 'OGG 音频', mime: 'audio/ogg', ext: 'ogg' },
    { g: '音频', n: 'FLAC 音频', mime: 'audio/flac', ext: 'flac' },
    { g: '音频', n: 'M4A 音频', mime: 'audio/mp4', ext: 'm4a' },
    { g: '视频', n: 'MP4 视频', mime: 'video/mp4', ext: 'mp4' },
    { g: '视频', n: 'WebM 视频', mime: 'video/webm', ext: 'webm' },
    { g: '视频', n: 'MOV 视频', mime: 'video/quicktime', ext: 'mov' },
    { g: '文档', n: 'PDF 文档', mime: 'application/pdf', ext: 'pdf' },
    { g: '文档', n: '纯文本', mime: 'text/plain', ext: 'txt' },
    { g: '文档', n: 'JSON', mime: 'application/json', ext: 'json' },
    { g: '文档', n: 'HTML', mime: 'text/html', ext: 'html' },
    { g: '压缩', n: 'ZIP 压缩包', mime: 'application/zip', ext: 'zip' },
    { g: '压缩', n: 'GZIP', mime: 'application/gzip', ext: 'gz' },
    { g: '其它', n: '二进制流（通用）', mime: 'application/octet-stream', ext: 'bin' },
    { g: '其它', n: '自定义 MIME…', mime: '__custom__', ext: 'bin' },
  ];

  // ---------- 文件签名（魔数）----------
  const MAGIC = [
    { sig: [0x89, 0x50, 0x4e, 0x47], mime: 'image/png' },
    { sig: [0xff, 0xd8, 0xff], mime: 'image/jpeg' },
    { sig: [0x47, 0x49, 0x46, 0x38], mime: 'image/gif' },
    { sig: [0x42, 0x4d], mime: 'image/bmp' },
    { sig: [0x00, 0x00, 0x01, 0x00], mime: 'image/x-icon' },
    { sig: [0x25, 0x50, 0x44, 0x46], mime: 'application/pdf' },
    { sig: [0x49, 0x44, 0x33], mime: 'audio/mpeg' },
    { sig: [0xff, 0xfb], mime: 'audio/mpeg' },
    { sig: [0x4f, 0x67, 0x67, 0x53], mime: 'audio/ogg' },
    { sig: [0x66, 0x4c, 0x61, 0x43], mime: 'audio/flac' },
    { sig: [0x1a, 0x45, 0xdf, 0xa3], mime: 'video/webm' },
    { sig: [0x50, 0x4b, 0x03, 0x04], mime: 'application/zip' },
    { sig: [0x50, 0x4b, 0x05, 0x06], mime: 'application/zip' },
    { sig: [0x1f, 0x8b], mime: 'application/gzip' },
  ];
  function match(bytes, off, sig) {
    for (let i = 0; i < sig.length; i++) if (bytes[off + i] !== sig[i]) return false;
    return true;
  }
  function sniff(bytes) {
    if (match(bytes, 0, [0x52, 0x49, 0x46, 0x46])) {
      if (match(bytes, 8, [0x57, 0x45, 0x42, 0x50])) return 'image/webp';
      if (match(bytes, 8, [0x57, 0x41, 0x56, 0x45])) return 'audio/wav';
    }
    if (match(bytes, 4, [0x66, 0x74, 0x79, 0x70])) {
      const brand = String.fromCharCode(bytes[8], bytes[9], bytes[10], bytes[11]);
      if (brand.startsWith('qt')) return 'video/quicktime';
      if (brand.startsWith('M4A')) return 'audio/mp4';
      return 'video/mp4';
    }
    for (const r of MAGIC) if (match(bytes, 0, r.sig)) return r.mime;
    return null;
  }
  function hexHead(bytes, n) {
    const out = [];
    for (let i = 0; i < Math.min(n, bytes.length); i++) out.push(bytes[i].toString(16).toUpperCase().padStart(2, '0'));
    return out.join(' ');
  }

  // ---------- 方向切换 ----------
  function setDir(dir) {
    const f2b = dir === 'f2b';
    $('segF2B').setAttribute('aria-pressed', String(f2b));
    $('segB2F').setAttribute('aria-pressed', String(!f2b));
    $('panelF2B').classList.toggle('on', f2b);
    $('panelB2F').classList.toggle('on', !f2b);
    $('mInK').textContent = f2b ? '输入' : 'Base64';
    $('mOutK').textContent = f2b ? 'Base64' : '还原字节';
    say(f2b ? '选一个文件，得到它的 Base64' : '粘贴 Base64，还原成文件');
  }
  $('segF2B').addEventListener('click', () => setDir('f2b'));
  $('segB2F').addEventListener('click', () => setDir('b2f'));

  // ========== 文件 → Base64 ==========
  const intake = $('intake'), fileInput = $('fileInput');
  function readFile(file) {
    if (!file) return;
    say('正在读取 “' + file.name + '” …');
    const reader = new FileReader();
    reader.onload = () => {
      const uri = reader.result;
      const comma = uri.indexOf(',');
      const raw = comma >= 0 ? uri.slice(comma + 1) : uri;
      $('outUri').value = uri;
      $('outRaw').value = raw;
      $('mIn').textContent = size(file.size);
      $('mOut').textContent = size(raw.length);
      // 签名读数
      const head = atob(raw.slice(0, 32));
      const bytes = new Uint8Array(head.length);
      for (let i = 0; i < head.length; i++) bytes[i] = head.charCodeAt(i);
      const guessed = sniff(bytes);
      const mime = file.type || guessed || '未知类型';
      $('sigAName').textContent = file.name + '，' + size(file.size);
      $('sigAMime').textContent = mime;
      $('sigAMime').classList.toggle('-guess', !file.type && !!guessed);
      $('sigAHex').innerHTML = '<b>' + hexHead(bytes, 12) + '</b>';
      $('sigA').classList.add('show');
      say('转换完成，可复制下面的 Base64', 'ok');
    };
    reader.onerror = () => say('文件读取失败，换个文件再试', 'bad');
    reader.readAsDataURL(file);
  }
  intake.addEventListener('click', (e) => { if (e.target !== fileInput) fileInput.click(); });
  fileInput.addEventListener('change', () => readFile(fileInput.files[0]));
  ['dragenter', 'dragover'].forEach((ev) => intake.addEventListener(ev, (e) => { e.preventDefault(); intake.classList.add('-drag'); }));
  ['dragleave', 'drop'].forEach((ev) => intake.addEventListener(ev, (e) => { e.preventDefault(); intake.classList.remove('-drag'); }));
  intake.addEventListener('drop', (e) => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) readFile(f); });

  // 复制按钮
  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const el = $(btn.dataset.copy);
      if (!el.value) { say('还没有可复制的内容', 'bad'); return; }
      const done = () => say('已复制到剪贴板', 'ok');
      if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(done).catch(() => { el.select(); done(); });
      else { el.select(); document.execCommand('copy'); done(); }
    });
  });

  // ========== Base64 → 文件 ==========
  const headerSelect = $('headerSelect'), fileName = $('fileName');
  const customMimeWrap = $('customMimeWrap'), customMime = $('customMime');
  const b64Input = $('b64Input'), preview = $('preview');

  (function buildSelect() {
    const groups = {};
    PRESETS.forEach((p, i) => { (groups[p.g] = groups[p.g] || []).push({ p, i }); });
    Object.keys(groups).forEach((g) => {
      const og = document.createElement('optgroup'); og.label = g;
      groups[g].forEach(({ p, i }) => {
        const op = document.createElement('option'); op.value = String(i);
        op.textContent = p.n + '（' + p.mime + '）'; og.appendChild(op);
      });
      headerSelect.appendChild(og);
    });
    headerSelect.value = '0';
  })();

  function curMime() {
    const p = PRESETS[+headerSelect.value];
    return p.mime === '__custom__' ? (customMime.value.trim() || 'application/octet-stream') : p.mime;
  }
  function curExt() { return PRESETS[+headerSelect.value].ext; }
  function syncName() { if (!fileName.dataset.touched) fileName.value = '下载文件.' + curExt(); }

  headerSelect.addEventListener('change', () => {
    customMimeWrap.classList.toggle('hide', PRESETS[+headerSelect.value].mime !== '__custom__');
    syncName();
  });
  fileName.addEventListener('input', () => { fileName.dataset.touched = '1'; });
  syncName();

  function parse() {
    let v = b64Input.value.trim();
    if (!v) throw new Error('先粘贴一段 Base64');
    let headMime = null;
    const m = v.match(/^data:([^;,]*)(;base64)?,/i);
    if (m) { headMime = m[1] || null; v = v.slice(m[0].length); }
    // 去掉首尾不属于 Base64 的字符（引号、说明文字、标点等），中间保持不动
    const body = v;
    v = v.replace(/^[^A-Za-z0-9+/=_-]+/, '').replace(/[^A-Za-z0-9+/=_-]+$/, '');
    const removed = body.length - v.length;
    v = v.replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (!v) throw new Error('去掉多余字符后没有内容');
    return { headMime, b64: v, removed };
  }
  function toBytes(b64) {
    let bin;
    try { bin = atob(b64); } catch (e) { throw new Error('这不是有效的 Base64，检查是否缺了字符'); }
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function selectMime(mime) {
    const idx = PRESETS.findIndex((p) => p.mime === mime);
    if (idx < 0) return false;
    headerSelect.value = String(idx);
    customMimeWrap.classList.add('hide');
    fileName.dataset.touched = ''; syncName();
    return true;
  }
  function showSig(bytes, mime, guessed) {
    $('sigBMime').textContent = mime;
    $('sigBMime').classList.toggle('-guess', !guessed);
    $('sigBHex').innerHTML = '<b>' + hexHead(bytes, 12) + '</b>';
    $('sigB').classList.add('show');
  }
  function closePreview() { preview.classList.remove('show'); preview.innerHTML = ''; }
  function showPreview(bytes, mime) {
    closePreview();
    if (!/^(image|audio|video)\//.test(mime)) return;
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    let el;
    if (mime.startsWith('image/')) { el = new Image(); el.src = url; }
    else if (mime.startsWith('audio/')) { el = document.createElement('audio'); el.controls = true; el.src = url; }
    else { el = document.createElement('video'); el.controls = true; el.src = url; }
    el.onerror = () => say('预览失败，但仍然可以下载', 'bad');
    preview.appendChild(el); preview.classList.add('show');
  }

  $('clearInput').addEventListener('click', () => {
    b64Input.value = ''; closePreview(); $('sigB').classList.remove('show');
    $('mIn').textContent = '0'; $('mOut').textContent = '0'; say('已清空');
  });

  $('detectBtn').addEventListener('click', () => {
    try {
      const { headMime, b64, removed } = parse();
      const bytes = toBytes(b64);
      $('mIn').textContent = size(b64.length);
      $('mOut').textContent = size(bytes.length);
      const note = removed > 0 ? '，已去掉首尾 ' + removed + ' 个多余字符' : '';
      const guessed = sniff(bytes);
      const mime = guessed || headMime;
      if (!mime) { showSig(bytes, '未能识别', false); say('内容里没找到已知签名，请手动选头部' + note, 'bad'); return; }
      if (!selectMime(mime)) {
        headerSelect.value = String(PRESETS.findIndex((p) => p.mime === '__custom__'));
        customMimeWrap.classList.remove('hide'); customMime.value = mime;
      }
      showSig(bytes, mime, !!guessed);
      showPreview(bytes, mime);
      say('识别为 ' + mime + (guessed ? '（按文件签名）' : '（按 data 头部）') + note, 'ok');
    } catch (e) { say(e.message, 'bad'); }
  });

  $('downloadBtn').addEventListener('click', () => {
    try {
      const { b64, removed } = parse();
      const bytes = toBytes(b64);
      const mime = curMime();
      let name = fileName.value.trim() || ('下载文件.' + curExt());
      if (!/\.[^.\\/]+$/.test(name)) name += '.' + curExt();
      $('mIn').textContent = size(b64.length);
      $('mOut').textContent = size(bytes.length);
      const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showPreview(bytes, mime);
      const note = removed > 0 ? '，已去掉首尾 ' + removed + ' 个多余字符' : '';
      say('已生成 “' + name + '”（' + size(bytes.length) + '）' + note + '，没弹窗就看下载目录', 'ok');
    } catch (e) { say(e.message, 'bad'); }
  });

  b64Input.addEventListener('paste', () => {
    setTimeout(() => {
      const m = b64Input.value.trim().match(/^data:([^;,]+)/i);
      if (m) selectMime(m[1]);
    }, 0);
  });
})();
</script>
</body>
</html>
