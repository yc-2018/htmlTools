<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML / CSS 代码生成器 - 仰晨工具集</title>
  <meta name="description" content="中文可视化 HTML 与 CSS 代码生成器，实时预览并一键复制代码。">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/index.html" title="返回仰晨工具集">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span class="brand-text">
          <strong>代码生成器</strong>
          <small>HTML · CSS</small>
        </span>
      </a>

      <nav class="mode-tabs" role="tablist" aria-label="生成器类型">
        <button class="mode-tab" type="button" role="tab" data-mode="html" aria-selected="true">HTML 生成器</button>
        <button class="mode-tab" type="button" role="tab" data-mode="css" aria-selected="false">CSS 生成器</button>
      </nav>

      <a class="home-link" href="/index.html">返回工具集</a>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" aria-label="生成器导航">
      <div class="sidebar-head">
        <label class="search-field">
          <span class="sr-only">搜索生成器</span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="generator-search" type="search" placeholder="搜索生成器…" autocomplete="off">
        </label>
      </div>
      <nav id="generator-nav" class="generator-nav" aria-label="生成器列表"></nav>
    </aside>

    <main class="workspace">
      <div class="mobile-toolbar">
        <label class="sr-only" for="mobile-generator">选择生成器</label>
        <select id="mobile-generator"></select>
      </div>

      <header class="tool-header">
        <div class="tool-heading">
          <p id="tool-category" class="tool-category"></p>
          <h1 id="tool-title"></h1>
          <p id="tool-desc" class="tool-desc"></p>
        </div>
        <button id="reset-button" class="ghost-button" type="button" title="恢复当前生成器的默认参数">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M4 10a8 8 0 1 1 2.34 6.66M4 10V5m0 5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          恢复默认
        </button>
      </header>

      <div class="tool-grid">
        <section class="panel options-panel" aria-labelledby="options-title">
          <header class="panel-head">
            <h2 id="options-title">参数设置</h2>
            <span id="options-count" class="panel-meta"></span>
          </header>
          <form id="options-form" autocomplete="off"></form>
        </section>

        <div class="output-column">
          <section class="panel preview-panel" aria-labelledby="preview-title">
            <header class="panel-head">
              <h2 id="preview-title">实时预览</h2>
              <span class="panel-meta">自动刷新</span>
            </header>
            <div class="preview-stage">
              <iframe id="preview-frame" title="代码实时预览" sandbox="allow-same-origin allow-forms" loading="lazy"></iframe>
            </div>
          </section>

          <section class="panel code-panel" aria-labelledby="code-title">
            <header class="panel-head">
              <h2 id="code-title">生成代码</h2>
              <div class="code-actions">
                <span id="code-lang" class="code-lang">HTML</span>
                <button id="copy-button" class="copy-button" type="button">复制代码</button>
              </div>
            </header>
            <div id="code-output" class="code-output"></div>
          </section>
        </div>
      </div>

      <footer class="tool-footer">
        <p>所有代码均在浏览器本地生成，不会上传任何数据。</p>
        <p>功能参考 <a href="https://webcode.tools/" target="_blank" rel="noreferrer">webcode.tools</a>，使用原生 HTML / CSS / JavaScript 实现。</p>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./data-core.js"></script>
  <script src="./data-html.js"></script>
  <script src="./data-css.js"></script>
  <script src="./app.js"></script>
</body>
</html>
