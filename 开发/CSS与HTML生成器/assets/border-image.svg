<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="边框图片示例">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="288" height="288" rx="22" fill="none" stroke="url(#frame)" stroke-width="12"/>
  <rect x="19" y="19" width="262" height="262" rx="15" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.75"/>
  <g fill="url(#frame)">
    <circle cx="34" cy="34" r="10"/>
    <circle cx="266" cy="34" r="10"/>
    <circle cx="34" cy="266" r="10"/>
    <circle cx="266" cy="266" r="10"/>
  </g>
  <g fill="#e0f2fe" opacity="0.95">
    <circle cx="34" cy="34" r="4"/>
    <circle cx="266" cy="34" r="4"/>
    <circle cx="34" cy="266" r="4"/>
    <circle cx="266" cy="266" r="4"/>
  </g>
  <g fill="url(#accent)" opacity="0.85">
    <rect x="128" y="14" width="44" height="12" rx="6"/>
    <rect x="128" y="274" width="44" height="12" rx="6"/>
    <rect x="14" y="128" width="12" height="44" rx="6"/>
    <rect x="274" y="128" width="12" height="44" rx="6"/>
  </g>
</svg>
