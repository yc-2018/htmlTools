<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 参考 https://github.chuyel.top/ 的页面让claude重写 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 注册时间查询</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3rem;
      gap: 1rem;
    }

    .logo {
      width: 48px;
      height: 48px;
      fill: #c9d1d9;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #c9d1d9;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-label {
      display: block;
      font-size: 0.9375rem;
      color: #8b949e;
      margin-bottom: 1.25rem;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.875rem 1rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 1rem;
      transition: all 0.2s;
      font-family: "SF Mono", Consolas, monospace;
    }

    input:focus {
      outline: none;
      border-color: #58a6ff;
      background: #0d1117;
    }

    input::placeholder {
      color: #484f58;
    }

    .prefix {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #8b949e;
      font-family: "SF Mono", Consolas, monospace;
      pointer-events: none;
      font-size: 1rem;
    }

    input.with-prefix {
      padding-left: 7.5rem;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .btn-primary {
      background: #f0f6fc;
      color: #0d1117;
    }

    .btn-primary:hover:not(:disabled) {
      background: #e6edf3;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: #8b949e;
      border: 1px solid #30363d;
    }

    .btn-secondary:hover {
      background: #21262d;
      border-color: #8b949e;
    }

    .quick-links {
      text-align: center;
      font-size: 0.875rem;
      color: #8b949e;
    }

    .quick-links span {
      margin-right: 0.5rem;
    }

    .quick-links a {
      color: #58a6ff;
      text-decoration: none;
      margin: 0 0.35rem;
    }

    .quick-links a:hover {
      text-decoration: underline;
    }

    .result {
      margin-top: 2rem;
      display: none;
    }

    .result.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    .user-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 0.25rem;
    }

    .user-login {
      font-size: 0.9375rem;
      color: #8b949e;
    }

    .info-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .info-label {
      font-size: 0.875rem;
      color: #8b949e;
      margin-bottom: 0.5rem;
    }

    .info-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: #58a6ff;
      font-family: "SF Mono", Consolas, monospace;
    }

    .info-sub {
      font-size: 0.875rem;
      color: #8b949e;
      margin-top: 0.5rem;
    }

    .duration-value {
      font-size: 1.125rem;
      font-weight: 600;
      color: #c9d1d9;
    }

    .error {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 8px;
      color: #f85149;
      font-size: 0.875rem;
      display: none;
    }

    .error.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8125rem;
      color: #8b949e;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #484f58;
      border-top-color: #0d1117;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }

      .card {
        padding: 1.5rem;
      }

      .button-group {
        grid-template-columns: 1fr;
      }

      .user-header {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      <h1>GitHub 注册时间</h1>
    </header>

    <div class="card">
      <div class="input-group">
        <div class="input-label">输入用户名，探寻代码之旅的起点。</div>
        <div class="input-wrapper">
          <span class="prefix">github.com/</span>
          <input
            type="text"
            id="username"
            class="with-prefix"
            autocomplete="off"
          >
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="searchUser()">查询</button>
        <button class="btn-secondary" onclick="clearResult()">清空</button>
      </div>

      <div class="quick-links">
        <span>快捷测试：</span>
        <a href="#" onclick="quickSearch('yc-2018'); return false;">yc-2018</a> ·
        <a href="#" onclick="quickSearch('claude'); return false;">claude</a>
      </div>

      <div id="error" class="error"></div>

      <div id="result" class="result"></div>
    </div>

    <footer>
      基于 <a href="https://docs.github.com/rest/users/users#get-a-user" target="_blank">GitHub 公开 API</a> · 无需登录授权
      <div style="opacity: .7;font-size: 10px;">注意:如果查不出来说明你的梯子污染严重,关闭或换一个再试试</div>
    </footer>
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('error');

    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchUser();
      }
    });

    function quickSearch(username) {
      usernameInput.value = username;
      searchUser();
    }

    function clearResult() {
      usernameInput.value = '';
      resultDiv.classList.remove('show');
      errorDiv.classList.remove('show');
      usernameInput.focus();
    }

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      resultDiv.classList.remove('show');
    }

    function hideError() {
      errorDiv.classList.remove('show');
    }

    function getRelativeTime(date) {
      const now = new Date();
      const diffTime = now - date;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const diffYears = Math.floor(diffDays / 365.25);

      if (diffYears >= 1) {
        return `${diffYears}年前`;
      } else if (diffDays >= 30) {
        const months = Math.floor(diffDays / 30);
        return `${months}个月前`;
      } else if (diffDays > 0) {
        return `${diffDays}天前`;
      } else {
        return '今天';
      }
    }

    function getDuration(date) {
      const now = new Date();
      const diffTime = now - date;
      const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      const years = Math.floor(totalDays / 365.25);
      const remainingDays = totalDays - Math.floor(years * 365.25);
      const months = Math.floor(remainingDays / 30);
      const days = remainingDays - (months * 30);

      return {
        years,
        months,
        days,
        totalDays
      };
    }

    async function searchUser() {
      const username = usernameInput.value.trim();

      if (!username) {
        showError('请输入 GitHub 用户名');
        return;
      }

      hideError();

      const btn = document.querySelector('.btn-primary');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '查询中<span class="loading"></span>';

      try {
        const response = await fetch(`https://api.github.com/users/${username}`);

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('用户不存在，请检查用户名是否正确');
          } else if (response.status === 403) {
            throw new Error('API 请求次数已达上限，请稍后再试');
          } else {
            throw new Error('查询失败，请稍后重试');
          }
        }

        const data = await response.json();
        displayResult(data);
      } catch (error) {
        showError(error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    function displayResult(data) {
      const createdAt = new Date(data.created_at);
      const relativeTime = getRelativeTime(createdAt);
      const duration = getDuration(createdAt);

      // 格式化为 2018-09-16 19:18:04 格式
      const formatDateTime = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hour = String(date.getHours()).padStart(2, '0');
        const minute = String(date.getMinutes()).padStart(2, '0');
        const second = String(date.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
      };

      resultDiv.innerHTML = `
        <div class="user-header">
          <img src="${data.avatar_url}" alt="${data.login}" class="avatar">
          <div>
            <div class="user-name">${data.name || data.login}</div>
            <div class="user-login">@${data.login}</div>
          </div>
        </div>

        <div class="info-box">
          <div class="info-label">账号创建时间 (UTC+8)</div>
          <div class="info-value">${formatDateTime(createdAt)}</div>
          <div class="info-sub">${relativeTime}</div>
        </div>

        <div class="info-box">
          <div class="info-label">已注册时长</div>
          <div class="duration-value">${duration.years}年 ${duration.months}月 ${duration.days}日（总计 ${duration.totalDays}天）</div>
        </div>
      `;

      resultDiv.classList.add('show');
    }
  </script>
</body>
</html>
