<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="手机 APP 协议跳转测试 — 输入 scheme 唤起应用，等待窗口可见，失败时按当前浏览器给出原因">
<title>协议跳转 · scheme 唤起测试</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --field: #DEE2E8;
    --panel: #FFFFFF;
    --sunk: #F4F6F8;
    --ink: #171B26;
    --soft: #5A6474;
    --dim: #6E7889;
    --line: #CDD3DB;
    --line-2: #E3E7EC;
    --go: #1B4DD8;
    --go-tint: #E8EDFC;
    --wait: #B8730A;
    --wait-tint: #FBF1DE;
    --fail: #C2352B;
    --fail-tint: #FBEBE9;
    --ok: #1B7A4B;
    --ok-tint: #E7F4EC;
    --mono: ui-monospace, 'SF Mono', Menlo, 'Cascadia Mono', Consolas, monospace;
    --sans: -apple-system, system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 24px 14px 34px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: var(--field);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .gate {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 18px 40px -26px rgba(23, 27, 38, .55);
  }

  /* 顶栏：标题 + 当前环境（失败原因几乎都出在这里） */
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 17px;
    border-bottom: 1px solid var(--line-2);
  }
  .head h1 { margin: 0; font-size: 16.5px; font-weight: 650; letter-spacing: -.2px; }
  .head p { margin: 1px 0 0; font-size: 12.5px; color: var(--dim); }
  .env {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 3px;
    background: var(--sunk);
    border: 1px solid var(--line-2);
    color: var(--soft);
  }
  .env.-caged { background: var(--wait-tint); border-color: #EBD6A8; color: var(--wait); }

  /* 输入 */
  .zone { padding: 16px 17px; border-bottom: 1px solid var(--line-2); }
  .lab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 7px; font-size: 12.5px; color: var(--soft); }
  .lab .n { font-family: var(--mono); font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

  .wrap { border: 1px solid var(--line); border-radius: 5px; background: var(--sunk); transition: border-color .15s, box-shadow .15s, background .15s; }
  .wrap:focus-within { background: #fff; border-color: var(--go); box-shadow: 0 0 0 3px var(--go-tint); }
  .wrap.-bad { background: #fff; border-color: var(--fail); box-shadow: 0 0 0 3px var(--fail-tint); }
  textarea {
    display: block; width: 100%; min-height: 84px;
    padding: 12px 13px;
    border: 0; outline: none; background: transparent; resize: vertical;
    font-family: var(--mono); font-size: 15px; line-height: 1.65;
    color: var(--ink); word-break: break-all;
    caret-color: var(--go);
    -webkit-appearance: none; border-radius: 0;
  }
  textarea::placeholder { color: #A3ACB9; }

  /* 解析出的 scheme 头：系统只认这一段 */
  .parse { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-family: var(--mono); font-size: 12.5px; min-height: 1.5em; color: var(--dim); }
  .parse .head-seg { color: var(--go); font-weight: 600; background: var(--go-tint); padding: 2px 6px; border-radius: 3px; }
  .parse .rest { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 常用协议 / 最近用过 */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font: inherit; font-size: 13px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel);
    color: var(--soft);
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
    transition: color .15s, border-color .15s, background .15s;
  }
  .chip:active, .chip:hover { color: var(--go); border-color: #9FB6EE; background: var(--go-tint); }
  .chip .code { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-left: 5px; }
  .chip:active .code, .chip:hover .code { color: var(--go); }

  .recent { margin-top: 14px; }
  .recent[hidden] { display: none; }
  .recent .lab button { border: 0; background: none; font: inherit; font-size: 12.5px; color: var(--soft); cursor: pointer; padding: 2px 4px; }
  .recent .lab button:hover { color: var(--fail); text-decoration: underline; }
  .chip.-old { font-family: var(--mono); font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; background: var(--sunk); }

  /* 唤起区：本页的主角 */
  .dispatch { padding: 17px; }
  .go {
    display: block; width: 100%;
    font: inherit; font-size: 17px; font-weight: 650; letter-spacing: 3px;
    padding: 16px;
    border: 0; border-radius: 5px;
    background: var(--go); color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .15s, transform .08s;
  }
  .go:active { transform: translateY(1px); }
  .go:disabled { cursor: default; }
  .go.-waiting { background: var(--wait); letter-spacing: 2px; }

  /* 等待窗口：2.8 秒内没切走，就认定没唤起成功 */
  .window { margin-top: 12px; height: 0; overflow: hidden; transition: height .2s; }
  .window.-open { height: 40px; }
  .track { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
  .track i { display: block; height: 100%; width: 100%; background: var(--wait); transform-origin: left; }
  .window.-open .track i { animation: drain var(--ms, 2800ms) linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .window p { margin: 7px 0 0; font-size: 12px; color: var(--wait); }

  .aux { display: flex; gap: 9px; margin-top: 12px; }
  .aux button {
    flex: 1;
    font: inherit; font-size: 14px;
    padding: 11px;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--soft);
    cursor: pointer; touch-action: manipulation;
    transition: color .15s, border-color .15s, background .15s;
  }
  .aux button:active, .aux button:hover { color: var(--ink); background: var(--sunk); }
  .aux button.-done { color: var(--ok); border-color: #A6D3B9; background: var(--ok-tint); }

  /* 结果 */
  .said { margin: 0; padding: 0 17px 17px; }
  .said[hidden] { display: none; }
  .said > div {
    padding: 12px 14px;
    border: 1px solid;
    border-radius: 5px;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .said b { font-weight: 650; }
  .said .-info { background: var(--go-tint); border-color: #C3D2F5; color: #153C9E; }
  .said .-warn { background: var(--wait-tint); border-color: #EBD6A8; color: #8A5606; }
  .said .-good { background: var(--ok-tint); border-color: #A6D3B9; color: #14603A; }
  .said .-err { background: var(--fail-tint); border-color: #F0C4C0; color: #9B2A22; }

  .note { padding: 13px 17px; border-top: 1px solid var(--line-2); background: var(--sunk); font-size: 11.5px; line-height: 1.6; color: var(--soft); }

  :focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .window.-open .track i { animation: none; transform: scaleX(1); }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --field: #11151C;
      --panel: #1A1F29;
      --sunk: #141922;
      --ink: #DFE4EC;
      --soft: #98A2B2;
      --dim: #6E7889;
      --line: #2F3744;
      --line-2: #262D38;
      --go: #5A8DF5;
      --go-tint: #1B2B47;
      --wait: #E3A742;
      --wait-tint: #33280F;
      --fail: #EE6A5D;
      --fail-tint: #351A17;
      --ok: #4FBF84;
      --ok-tint: #122E20;
    }
    .go { color: #0C1220; }
    .said .-info { color: #A8C3FA; }
    .said .-warn { color: #EDC276; }
    .said .-good { color: #7DD5A3; }
    .said .-err { color: #F49A90; }
  }
</style>
</head>
<body>
<main class="gate">
  <div class="head">
    <div>
      <h1>协议跳转</h1>
      <p>输入 scheme，看能不能唤起应用</p>
    </div>
    <div class="env" id="env">检测中</div>
  </div>

  <div class="zone">
    <div class="lab"><span>协议地址</span><span class="n" id="count">0 字符</span></div>
    <div class="wrap" id="wrap">
      <textarea id="url" rows="3" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
        placeholder="alipay://&#10;weixin://dl/scan&#10;intent://scan/#Intent;scheme=zxing;end"></textarea>
    </div>
    <div class="parse" id="parse"></div>
  </div>

  <div class="zone">
    <div class="lab"><span>常用协议</span></div>
    <div class="chips" id="presets"></div>
    <div class="recent" id="recent" hidden>
      <div class="lab"><span>最近用过</span><button id="forget" type="button">清空</button></div>
      <div class="chips" id="recentList"></div>
    </div>
  </div>

  <div class="dispatch">
    <button class="go" id="go" type="button">唤起应用</button>
    <div class="window" id="window">
      <div class="track"><i></i></div>
      <p id="windowText">等系统接管，切走就算成功</p>
    </div>
    <div class="aux">
      <button id="clear" type="button">清空</button>
      <button id="copy" type="button">复制链接</button>
    </div>
  </div>

  <div class="said" id="said" hidden><div></div></div>

  <div class="note">
    唤起会同时用 <code>location.href</code>、隐藏 iframe 两种方式试（安卓再加一次 <code>window.open</code>）。
    页面在等待窗口内被切到后台，就说明应用接住了；窗口走完还停在这里，才判定没唤起成功。
    多行输入只取第一行。链接可以用 <code>?url=</code> 预填，加 <code>&auto=1</code> 打开即唤起。
  </div>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const url = $('url'), wrap = $('wrap'), go = $('go'), win = $('window');
  const said = $('said'), saidBox = said.firstElementChild;

  const JUMP_MS = 2800;
  const HISTORY_KEY = 'app_protocol_history';
  const MAX_HISTORY = 8;
  const PRESETS = [
    ['支付宝', 'alipay://'], ['微信', 'weixin://'], ['淘宝', 'taobao://'],
    ['淘宝备用', 'tbopen://'], ['京东', 'openapp.jdmobile://'], ['QQ', 'mqq://'],
  ];

  let jumpTimer = null, visListener = null, jumping = false;

  // ---------- 环境：唤起失败的原因基本都出在这儿 ----------
  const B = (function () {
    const ua = navigator.userAgent.toLowerCase();
    return {
      wechat: ua.includes('micromessenger'),
      qq: ua.includes('qq/') && !ua.includes('qqbrowser'),
      qqb: ua.includes('qqbrowser'),
      alipay: ua.includes('alipayclient'),
      weibo: ua.includes('weibo'),
      ios: /iphone|ipad|ipod/.test(ua),
      android: ua.includes('android'),
    };
  })();
  B.caged = B.wechat || B.qq || B.alipay || B.weibo;

  // ---------- 取值与校验 ----------
  const raw = () => url.value || '';
  function cleanUrl() {
    const lines = raw().trim().split('\n').filter((l) => l.trim() !== '');
    return lines.length ? lines[0].trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '';
  }
  const SCHEME = /^([a-zA-Z][a-zA-Z0-9+\-.]*):\/\//;
  const valid = (u) => SCHEME.test(u) || /^intent:\/\//i.test(u);
  const schemeOf = (u) => { const m = u.match(SCHEME); return m ? m[1].toLowerCase() : null; };

  // ---------- 说明区 ----------
  function say(html, kind) {
    saidBox.className = '-' + kind;
    saidBox.innerHTML = html;
    said.hidden = false;
  }
  function hush() { said.hidden = true; saidBox.innerHTML = ''; }
  function flagBad(on) {
    wrap.classList.toggle('-bad', on);
    if (on) setTimeout(() => { if (!jumping) wrap.classList.remove('-bad'); }, 2200);
  }

  // ---------- 输入区回显 ----------
  function refresh() {
    $('count').textContent = raw().length + ' 字符';
    const p = $('parse');
    p.textContent = '';
    const u = cleanUrl();
    if (!u) { p.textContent = '系统只看 :// 前面那段，决定把它交给哪个应用'; return; }
    const m = u.match(/^([a-zA-Z][a-zA-Z0-9+\-.]*):\/\/([\s\S]*)$/);
    if (!m) { p.textContent = '还缺协议头，形如 alipay://'; return; }
    const h = document.createElement('span');
    h.className = 'head-seg';
    h.textContent = m[1];
    const r = document.createElement('span');
    r.className = 'rest';
    r.textContent = '://' + m[2];
    p.append(h, r);
  }

  function fill(value) {
    if (jumping) return;
    url.value = value;
    hush();
    wrap.classList.remove('-bad');
    refresh();
    url.focus();
  }

  // ---------- 常用协议 + 最近用过 ----------
  PRESETS.forEach(([name, scheme]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.innerHTML = '';
    b.appendChild(document.createTextNode(name));
    const code = document.createElement('span');
    code.className = 'code';
    code.textContent = scheme.replace('://', '');
    b.appendChild(code);
    b.addEventListener('click', () => fill(scheme));
    $('presets').appendChild(b);
  });

  function history() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
  }
  function storeHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function remember(u) {
    if (!u) return;
    const list = [u].concat(history().filter((x) => x !== u)).slice(0, MAX_HISTORY);
    storeHistory(list);
    drawHistory();
  }
  function drawHistory() {
    const list = history(), box = $('recentList');
    box.textContent = '';
    $('recent').hidden = list.length === 0;
    list.forEach((u) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip -old';
      b.textContent = u.length > 26 ? u.slice(0, 26) + '…' : u;
      b.title = u;
      b.addEventListener('click', () => fill(u));
      box.appendChild(b);
    });
  }

  // ---------- 等待窗口：这段时间内页面被切到后台，就算唤起成功 ----------
  function openWindow() {
    win.style.setProperty('--ms', JUMP_MS + 'ms');
    win.classList.remove('-open');
    void win.offsetWidth;
    win.classList.add('-open');
  }

  function watch() {
    unwatch();
    visListener = () => {
      if (document.hidden) {
        // 切走了，说明系统把协议交出去了，别再判失败
        clearTimeout(jumpTimer);
        jumpTimer = null;
      } else if (jumping && !jumpTimer) {
        settle();
        say('页面被切走过，说明系统确实把协议交出去了。没看到应用打开的话，可能是装了别的版本。', 'good');
      }
    };
    document.addEventListener('visibilitychange', visListener);
  }
  function unwatch() {
    if (visListener) document.removeEventListener('visibilitychange', visListener);
    visListener = null;
    if (jumpTimer) { clearTimeout(jumpTimer); jumpTimer = null; }
  }

  function settle() {
    jumping = false;
    go.disabled = false;
    go.classList.remove('-waiting');
    go.textContent = '唤起应用';
    win.classList.remove('-open');
    unwatch();
  }

  // ---------- 唤起：三种方式一起试，哪个生效算哪个 ----------
  function fire(u) {
    if (jumping) return;
    jumping = true;
    go.disabled = true;
    go.classList.add('-waiting');
    go.textContent = '正在唤起';
    hush();
    wrap.classList.remove('-bad');
    openWindow();
    watch();

    try { window.location.href = u; } catch (e) {}
    try {
      const f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = u;
      document.body.appendChild(f);
      setTimeout(() => { if (f.parentNode) f.parentNode.removeChild(f); }, 2000);
    } catch (e) {}
    if (B.android) {
      try {
        const w = window.open(u, '_blank');
        if (w) setTimeout(() => { try { w.close(); } catch (e) {} }, 1500);
      } catch (e) {}
    }

    jumpTimer = setTimeout(() => missed(u), JUMP_MS);
  }

  // 窗口走完还停在这个页面，才判定没唤起成功
  function missed(u) {
    jumpTimer = null;
    settle();
    const s = schemeOf(u);
    let msg, kind = 'warn';
    if (B.wechat) msg = '微信会拦掉大部分协议。点右上角 <b>…</b> 选 <b>在浏览器中打开</b> 再试一次。';
    else if (B.qq || B.qqb) msg = 'QQ 里限制协议跳转，复制链接到系统浏览器再试。';
    else if (B.alipay) msg = '支付宝内不放行外部协议，复制链接到系统浏览器再试。';
    else if (B.weibo) msg = '微博内置浏览器会拦协议，复制链接到系统浏览器再试。';
    else if (!B.ios && !B.android) { msg = '桌面浏览器上手机应用的协议不会有响应，用手机打开这个页面才测得出来。'; kind = 'info'; }
    else if (s && s !== 'http' && s !== 'https') msg = '没唤起成功。<b>' + s + '</b> 对应的应用可能没装，或者协议名写错了。也可以复制链接，粘到浏览器地址栏直接回车试试。';
    else msg = '没唤起成功，检查一下链接，或者复制后在浏览器里打开。';
    say(msg, kind);
    // 桌面上失败是环境问题，不是链接写错了，别把输入框标红
    if (kind !== 'info') flagBad(true);
  }

  // 粘贴过来的链接常带零宽字符，按码位去掉，免得协议头对不上
  const ZW_CODES = [0x200B, 0x200C, 0x200D, 0xFEFF];
  function stripZW(s) {
    let out = s;
    for (const c of ZW_CODES) out = out.split(String.fromCharCode(c)).join('');
    return out;
  }

  // ---------- 发起 ----------
  function dispatch() {
    if (jumping) return;
    const u = cleanUrl();
    hush();
    if (!u) {
      say('先填一个协议地址', 'err');
      flagBad(true);
      url.focus();
      return;
    }
    if (!valid(u)) {
      say('缺协议头，得写成 <b>alipay://</b> 这种形式', 'err');
      flagBad(true);
      url.focus();
      return;
    }
    if (raw().trim() !== u) { url.value = u; refresh(); }
    remember(u);
    fire(u);
  }

  async function copyLink() {
    const u = cleanUrl() || raw().trim();
    const btn = $('copy');
    if (!u) { say('没有可复制的内容', 'err'); return; }
    let ok = false;
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(u); ok = true; } catch (e) {}
    }
    if (!ok) {
      try {
        const t = document.createElement('textarea');
        t.value = u;
        t.style.position = 'fixed';
        t.style.left = '-9999px';
        document.body.appendChild(t);
        t.select();
        ok = document.execCommand('copy');
        document.body.removeChild(t);
      } catch (e) {}
    }
    if (ok) {
      btn.textContent = '已复制';
      btn.classList.add('-done');
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.textContent = '复制链接'; btn.classList.remove('-done'); }, 1800);
    } else {
      say('复制没成功，手动选中复制吧', 'err');
    }
  }

  function wipe() {
    if (jumping) return;
    url.value = '';
    hush();
    wrap.classList.remove('-bad');
    refresh();
    url.focus();
  }

  // ---------- 事件 ----------
  go.addEventListener('click', dispatch);
  $('clear').addEventListener('click', wipe);
  $('copy').addEventListener('click', copyLink);
  $('forget').addEventListener('click', () => { storeHistory([]); drawHistory(); });

  url.addEventListener('input', () => {
    refresh();
    if (wrap.classList.contains('-bad')) { wrap.classList.remove('-bad'); hush(); }
  });
  url.addEventListener('paste', () => setTimeout(() => {
    const cleaned = stripZW(raw());
    if (cleaned !== raw()) url.value = cleaned;
    refresh();
    hush();
    wrap.classList.remove('-bad');
  }, 30));
  url.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); dispatch(); }
    if (e.key === 'Escape' && !jumping && raw().trim()) { e.preventDefault(); wipe(); }
  });
  window.addEventListener('beforeunload', unwatch);

  // ---------- 初始 ----------
  (function init() {
    const label = B.wechat ? '微信内' : B.qq ? 'QQ 内' : B.alipay ? '支付宝内'
      : B.weibo ? '微博内' : B.qqb ? 'QQ 浏览器' : B.ios ? 'iOS' : B.android ? 'Android' : '桌面';
    const env = $('env');
    env.textContent = label;
    env.classList.toggle('-caged', B.caged);
    env.title = navigator.userAgent;

    drawHistory();
    refresh();

    if (B.caged) say('你在' + label + '打开这个页面，协议跳转很可能被拦住。测不通就换系统浏览器再试。', 'warn');
    else if (!B.ios && !B.android) say('桌面浏览器不会响应手机应用的协议，用手机打开这个页面才测得准。', 'info');

    const q = new URLSearchParams(location.search);
    const preset = q.get('url') || q.get('scheme') || q.get('link');
    if (preset) {
      try { url.value = decodeURIComponent(preset); } catch (e) { url.value = preset; }
      refresh();
      const auto = q.get('auto');
      if (auto === '1' || auto === 'true') {
        setTimeout(() => { if (valid(cleanUrl())) dispatch(); }, 700);
      }
    }
    // 手机上不自动聚焦，免得一进来就弹键盘挡住内容
    if (!raw().trim() && !B.ios && !B.android) setTimeout(() => url.focus(), 400);
  })();
})();
</script>
</body>
</html>
