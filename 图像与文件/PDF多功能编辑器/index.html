<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="PDF 多功能编辑器 — 在浏览器本地删除页面、插入 PDF、插入图片，无需上传服务器。">
<title>PDF多功能编辑器</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="./styles.css">
<!--通义编写： https://www.qianwen.com/share?shareId=0fcdd159-1f9c-4620-9fcd-588cabd19ac1 -->
<!--这库的文档 https://pdf-lib.js.org/docs/api/ -->
<script src="./pdf-lib.js"></script>
</head>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">PDF</span>
      <div>
        <h1>PDF 多功能编辑器</h1>
        <p class="tagline">删页 · 插 PDF · 插图片，全部在本地浏览器完成</p>
      </div>
    </div>
    <div class="top-side">
      <div class="stat"><b id="currentTotalPages">0</b><span>页</span></div>
      <a class="ghost-btn" href="./压缩/index.html">PDF 压缩 →</a>
    </div>
  </header>

  <main class="workspace">
    <!-- 左栏：步骤 -->
    <div class="col-left">
      <section class="card">
        <h2 class="card-title"><i>1</i>上传主 PDF</h2>
        <label class="drop" id="dropZone">
          <input type="file" id="mainPdfFileInput" class="sr-only" accept="application/pdf,.pdf"/>
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
            <path d="M14 3v5h5"/>
            <path d="M12 17v-5"/>
            <path d="m9.5 14.5 2.5-2.5 2.5 2.5"/>
          </svg>
          <span class="drop-title" id="dropTitle">点击或拖入 PDF 文件</span>
          <span class="drop-sub" id="dropSub">文件只在本地处理，不会上传</span>
        </label>
      </section>

      <section class="card">
        <h2 class="card-title"><i>2</i>选择操作</h2>
        <div class="tabs" role="tablist" aria-label="操作类型">
          <button type="button" class="tab is-active" role="tab" aria-selected="true" aria-controls="deleteSection" data-op="delete">删除页面</button>
          <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="insertPdfSection" data-op="insertPdf">插入 PDF</button>
          <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="insertImageSection" data-op="insertImage">插入图片</button>
        </div>

        <!-- 删除页面 -->
        <div id="deleteSection" class="pane" role="tabpanel">
          <label class="field">
            <span class="label">要删除的页面</span>
            <input type="text" id="pageNumbersInput" placeholder="例如: 1,3-5,7" inputmode="numeric"/>
          </label>
          <p class="hint">
            支持单页 <code>1</code>、多页 <code>1,3,5</code>、范围 <code>2-5</code> 或组合 <code>1,3-5,7</code>
          </p>
          <button type="button" class="btn btn-danger btn-block" onclick="deletePages(this)">删除所选页面</button>
        </div>

        <!-- 插入 PDF -->
        <div id="insertPdfSection" class="pane" hidden role="tabpanel">
          <div class="row-2">
            <label class="field">
              <span class="label">插入位置</span>
              <select id="insertPositionPdf">
                <option value="before">在第几页前</option>
                <option value="after">在第几页后</option>
              </select>
            </label>
            <label class="field">
              <span class="label">页码</span>
              <input type="number" id="insertPageNumberPdf" min="1" value="1"/>
            </label>
          </div>
          <label class="field">
            <span class="label">要插入的 PDF</span>
            <input type="file" id="insertPdfFileInput" accept="application/pdf,.pdf"/>
          </label>
          <button type="button" class="btn btn-block" onclick="insertPdf(this)">插入 PDF</button>
        </div>

        <!-- 插入图片 -->
        <div id="insertImageSection" class="pane" hidden role="tabpanel">
          <div class="row-2">
            <label class="field">
              <span class="label">插入位置</span>
              <select id="insertPositionImage">
                <option value="before">在第几页前</option>
                <option value="after">在第几页后</option>
              </select>
            </label>
            <label class="field">
              <span class="label">页码</span>
              <input type="number" id="insertPageNumberImage" min="1" value="1"/>
            </label>
          </div>
          <label class="field">
            <span class="label">要插入的图片</span>
            <input type="file" id="insertImageFileInput" accept="image/png,image/jpeg"/>
          </label>
          <p class="hint">支持 JPG、PNG，图片会成为一张独立的新页面</p>
          <button type="button" class="btn btn-block" onclick="insertImage(this)">插入图片</button>
        </div>
      </section>
    </div>

    <!-- 右栏：预览与导出 -->
    <section class="card preview-card">
      <div class="card-head">
        <h2 class="card-title"><i>3</i>预览与导出</h2>
        <span class="hist-step" id="histStep">未载入</span>
        <div class="head-actions">
          <button type="button" class="icon-btn" id="undoBtn" onclick="undo()" disabled title="回退 (Ctrl+Z)" aria-label="回退">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 14 4 9l5-5"/>
              <path d="M4 9h9a6 6 0 0 1 0 12H8"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="redoBtn" onclick="redo()" disabled title="前进 (Ctrl+Y)" aria-label="前进">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 14 5-5-5-5"/>
              <path d="M20 9h-9a6 6 0 0 0 0 12h5"/>
            </svg>
          </button>
          <button type="button" class="btn" id="downloadBtn" onclick="downloadPdf(this)" disabled>下载 PDF</button>
          <button type="button" class="btn btn-quiet" onclick="resetEditor()">重置</button>
        </div>
      </div>
      <div class="preview">
        <iframe id="pdfPreview" title="PDF 预览"></iframe>
        <div class="preview-empty" id="previewEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
            <path d="M14 3v5h5"/>
            <path d="M9 13h6M9 17h4"/>
          </svg>
          <p>还没有载入 PDF</p>
          <span>上传后在这里查看每一页的修改效果</span>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="./app.js"></script>
</body>
</html>
